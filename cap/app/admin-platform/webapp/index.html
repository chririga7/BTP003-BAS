<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurazione Piattaforma</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.148.11/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{"z.doc.platform.adminplatform": "./"}'
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-flexibility-services='[{"connector": "LocalStorageConnector"}]'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div data-sap-ui-component
         data-name="z.doc.platform.adminplatform"
         data-id="container"
         data-settings='{"id": "adminplatform"}'
         style="height: 100%">
    </div>
</body>
</html>
